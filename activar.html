<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Activar equipo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4374">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
  body { background: #F3F5F7; min-height: 100vh; }
  .contenedor-activar { display: flex; flex-direction: column; gap: 18px; padding: 40px 20px 28px; max-width: 420px; margin: 0 auto; min-height: 100vh; }

  .barra-progreso { display: flex; align-items: center; gap: 8px; }
  .barra-progreso span { height: 6px; flex-grow: 1; border-radius: 3px; background: #DCE2E7; }
  .barra-progreso span.activo { background: #2E4374; }
  .paso-actual { font-size: 13px; font-weight: 600; color: #64707C; margin-bottom: 6px; }
  h1 { font-size: 26px; line-height: 1.15; font-weight: 700; color: #1A2530; letter-spacing: -.01em; margin-bottom: 6px; }
  .sub { font-size: 14.5px; line-height: 1.45; color: #64707C; }

  .btn-escanear-grande {
    height: 140px; border-radius: 24px; border: 2px dashed #AFC0E6; background: #EEF1F8; color: #2E4374;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; width: 100%;
  }
  .icono-escanear-grande { width: 54px; height: 54px; border-radius: 18px; background: #2E4374; color: white; display: flex; align-items: center; justify-content: center; }
  .divisor-o { display: flex; align-items: center; gap: 12px; color: #96A2AC; font-size: 12.5px; }
  .divisor-o .linea { height: 1px; flex-grow: 1; background: #DCE2E7; }

  label { font-size: 12.5px; color: #64707C; font-weight: 600; display: block; margin-bottom: 6px; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 0 16px; height: 54px; border-radius: 14px; border: 1.5px solid #DCE2E7; background: white; outline: 0; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #1A2530; }
  textarea { font-family: 'IBM Plex Mono', monospace; resize: none; height: 60px; padding-top: 12px; }

  .grid-info-codigo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tarjeta-info-codigo { padding: 12px; border-radius: 14px; background: white; display: flex; flex-direction: column; gap: 4px; }
  .tarjeta-info-codigo .prefijo { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #2E4374; }
  .tarjeta-info-codigo .desc { font-size: 11.5px; line-height: 1.35; color: #64707C; }

  .pie-activar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: white; font-size: 12px; color: #64707C; }
  .pie-activar span:last-child { font-family: 'IBM Plex Mono', monospace; color: #1A2530; word-break: break-all; text-align: right; }

  .btn-activar { width: 100%; height: 56px; border-radius: 14px; border: none; background: #2E4374; color: white; font-weight: 700; font-size: 16px; }
  .btn-activar:disabled { opacity: .4; }
  .btn-secundario { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #DCE2E7; background: white; color: #1A2530; font-weight: 600; font-size: 13px; }
  .error { background: #F7E5E3; color: #C5433A; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }

  #pasoCodigo { display: flex; flex-direction: column; gap: 14px; }
  .paso2 { display: none; flex-direction: column; gap: 14px; }

  .modal-full { position: fixed; inset: 0; background: black; z-index: 60; display: none; flex-direction: column; }
  .modal-full.activo { display: flex; }
  .header-escaner { color: white; padding: 16px; display: flex; justify-content: space-between; font-size: 14px; }
  #readerActivacion { flex: 1; }
</style>
</head>
<body>

<div class="contenedor-activar">
  <div class="barra-progreso" id="barraProgreso">
    <span class="activo"></span>
    <span></span>
  </div>
  <div>
    <div class="paso-actual" id="pasoActualTexto">Paso 1 de 2</div>
    <h1 id="tituloActivar">Activa este equipo</h1>
    <p class="sub" id="subActivar">Solo se hace una vez. Pega o escanea el código que te dieron.</p>
  </div>

  <div id="pasoCodigo">
    <button type="button" class="btn-escanear-grande" onclick="abrirEscanerActivacion()">
      <span class="icono-escanear-grande">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 13v3"/></svg>
      </span>
      Escanear código QR
    </button>
    <div class="divisor-o"><span class="linea"></span>o pégalo<span class="linea"></span></div>
    <div>
      <label for="inputCodigo">Código</label>
      <textarea id="inputCodigo" placeholder="CLI-...#N1 o IHINV-..."></textarea>
    </div>
    <div class="grid-info-codigo">
      <div class="tarjeta-info-codigo"><span class="prefijo">CLI-…</span><span class="desc">Equipo principal del local</span></div>
      <div class="tarjeta-info-codigo"><span class="prefijo">IHINV-…</span><span class="desc">Equipo adicional · vale 15 min</span></div>
    </div>
  </div>

  <div id="pasoNombre" class="paso2">
    <p class="sub" id="infoCliente"></p>
    <div>
      <label for="inputNombreEquipo">¿Cómo le quieres llamar a este equipo?</label>
      <input type="text" id="inputNombreEquipo" placeholder="Ej: Caja 2, Celular de Juan...">
    </div>
  </div>

  <div id="cajaError"></div>
  <div style="flex-grow:1;"></div>
  <div class="pie-activar">
    <span>ID de este equipo</span>
    <span id="deviceIdMostrado">generando...</span>
  </div>
  <button class="btn-activar" id="btnValidar" onclick="validarCodigo()">Validar código</button>
  <button class="btn-activar" id="btnActivarPaso2" onclick="confirmarActivacion()" style="display:none;">Activar</button>
</div>

<!-- ===== ESCANER DE CAMARA (activacion) ===== -->
<div class="modal-full" id="modalEscanerActivacion">
  <div class="header-escaner">
    <span onclick="cerrarEscanerActivacion()">✕</span>
    <span>Escanea el código</span>
  </div>
  <div id="readerActivacion"></div>
</div>

<script src="firebase-sync.bundle.js"></script>
<script src="carrito_compartido.js"></script>
<script src="motor.js"></script>
<script src="html5-qrcode.min.js"></script>
<script>
  inicializarFirebase();

  window.addEventListener('DOMContentLoaded', () => {
    // Si este equipo ya esta activado y la licencia sigue vigente, no tiene
    // sentido mostrar el formulario de activacion de nuevo - eso confundia
    // (por ejemplo, al tocar "atras" en el navegador). Se manda derecho al
    // panel, que ahi sí pide iniciar sesion con el usuario de cada persona.
    const { vigente } = estadoEquipoVigente();
    const parametros = new URLSearchParams(location.search);
    if (vigente && parametros.get('vencida') !== '1' && parametros.get('pausado') !== '1') {
      window.location.href = 'panel.html';
      return;
    }

    document.getElementById('deviceIdMostrado').textContent = getDeviceId();
    if (parametros.get('vencida') === '1') {
      document.getElementById('subActivar').textContent = 'Tu período de prueba venció — pide una clave nueva para seguir usando el programa.';
      document.getElementById('subActivar').style.color = '#C5433A';
    } else if (parametros.get('pausado') === '1') {
      document.getElementById('subActivar').textContent = 'Esta cuenta fue pausada — contacta a IH Sistemas para reactivarla.';
      document.getElementById('subActivar').style.color = '#C5433A';
    }
  });

  let codigoValidado = null;

  let _html5QrCodeActivacion = null;
  function abrirEscanerActivacion() {
    document.getElementById('modalEscanerActivacion').classList.add('activo');
    _html5QrCodeActivacion = new Html5Qrcode('readerActivacion', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] });
    _html5QrCodeActivacion.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (codigoLeido) => {
        cerrarEscanerActivacion();
        document.getElementById('inputCodigo').value = codigoLeido;
        validarCodigo();
      }
    ).catch(() => {
      document.getElementById('readerActivacion').innerHTML = '<p style="color:white; text-align:center; padding:30px;">No se pudo abrir la cámara — revisa que le hayas dado permiso al navegador.</p>';
    });
  }
  function cerrarEscanerActivacion() {
    // stop() puede tirar error de una (no solo rechazar la promesa) si la
    // camara nunca llego a arrancar - el try/catch evita que eso deje la
    // pantalla negra trabada sin poder volver atras.
    if (_html5QrCodeActivacion) {
      try { _html5QrCodeActivacion.stop().catch(() => {}); } catch (e) {}
      _html5QrCodeActivacion = null;
    }
    document.getElementById('modalEscanerActivacion').classList.remove('activo');
  }

  async function validarCodigo() {
    const texto = document.getElementById('inputCodigo').value.trim();
    const cajaError = document.getElementById('cajaError');
    cajaError.innerHTML = '';
    if (!texto) return;

    const btn = document.getElementById('btnValidar');
    btn.disabled = true;

    const limpio = texto.toUpperCase();
    if (limpio.startsWith('CLI-')) {
      // Codigo de cliente+local ("CLI-XXXXXXXXXX#N1") - se consulta al
      // servidor de verdad, no se calcula nada localmente (asi no se puede
      // falsificar). Mismo esquema que Parking (cliente+sede).
      const partes = parsearCodigoNegocio(texto);
      if (!partes) {
        cajaError.innerHTML = `<div class="error">Este código de cliente está incompleto — le falta la parte del local (después del #). Pídele el código completo a Nacho o a tu jefe.</div>`;
        btn.disabled = false;
        return;
      }
      const [cliente, msg] = await obtenerClienteRemoto(partes.clienteId);
      if (!cliente) {
        cajaError.innerHTML = `<div class="error">${msg}</div>`;
        btn.disabled = false;
        return;
      }
      const [negocio, msgNegocio] = await obtenerNegocioParaActivarRemoto(partes.clienteId, partes.negocioId);
      if (!negocio) {
        cajaError.innerHTML = `<div class="error">${msgNegocio}</div>`;
        btn.disabled = false;
        return;
      }
      codigoValidado = { tipo: 'cliente', cliente, negocio };
      document.getElementById('infoCliente').textContent =
        `Vas a activar "${cliente.nombre} · ${negocio.nombre}" — serás el equipo PRINCIPAL (maestro) de este local.`;
    } else if (limpio.startsWith('IHINV-')) {
      const [inv, msg] = await validarInvitacionRemota(texto);
      if (!inv) {
        cajaError.innerHTML = `<div class="error">${msg}</div>`;
        btn.disabled = false;
        return;
      }
      // La invitacion solo dice A QUE cliente/local unirse - los datos
      // reales (capacidad, vencimiento) se consultan frescos al servidor aca.
      const [cliente, msgCliente] = await obtenerClienteRemoto(inv.cliente_id);
      if (!cliente) {
        cajaError.innerHTML = `<div class="error">${msgCliente}</div>`;
        btn.disabled = false;
        return;
      }
      const [negocio, msgNegocio] = await obtenerNegocioParaActivarRemoto(inv.cliente_id, inv.negocio_id);
      if (!negocio) {
        cajaError.innerHTML = `<div class="error">${msgNegocio}</div>`;
        btn.disabled = false;
        return;
      }
      codigoValidado = { tipo: 'invitacion', cliente, negocio, codigoInvitacion: inv.codigo_invitacion };
      document.getElementById('infoCliente').textContent =
        `Te vas a sumar a "${cliente.nombre} · ${negocio.nombre}" como equipo adicional.`;
    } else {
      // Código de "primer ingreso" que Manager IH pre-genera para un jefe
      // (o cualquier usuario) antes de que exista ningún equipo activado -
      // ver CONTEXTO_HANDOFF_JEFE_QR.md. No tiene un prefijo fijo como
      // CLI-/IHINV- (viene tal cual de Manager IH), por eso se prueba recién
      // acá, después de descartar los otros 2 formatos.
      const partesUsuario = parsearCodigoUsuarioDirecto(texto);
      if (!partesUsuario) {
        cajaError.innerHTML = `<div class="error">No reconozco este código — revisa que esté completo y sin espacios de más.</div>`;
        btn.disabled = false;
        return;
      }
      const [cliente, msgCliente] = await obtenerClienteRemoto(partesUsuario.clienteId);
      if (!cliente) {
        cajaError.innerHTML = `<div class="error">${msgCliente}</div>`;
        btn.disabled = false;
        return;
      }
      const [negocio, msgNegocio] = await obtenerNegocioParaActivarRemoto(partesUsuario.clienteId, partesUsuario.negocioId);
      if (!negocio) {
        cajaError.innerHTML = `<div class="error">${msgNegocio}</div>`;
        btn.disabled = false;
        return;
      }
      const [usuario, msgUsuario] = await obtenerUsuarioParaActivarRemoto(partesUsuario.clienteId, partesUsuario.usuarioId);
      if (!usuario) {
        cajaError.innerHTML = `<div class="error">${msgUsuario}</div>`;
        btn.disabled = false;
        return;
      }
      // Este código no dice si el equipo que lo escanea debe ser el
      // principal o uno adicional (a diferencia de CLI-/IHINV-, que ya lo
      // saben de antemano) - se decide mirando si el local todavía no tiene
      // NINGÚN equipo activado (caso típico: es la primera vez que alguien
      // de ese negocio entra) o si ya tiene alguno (este QR se está usando
      // para sumar a un empleado nuevo a un negocio que ya está andando).
      const equiposActuales = await listarEquiposRemoto(cliente.cliente_id, negocio.negocio_id);
      const rolEquipo = equiposActuales.length === 0 ? 'maestro' : 'sub';
      if (rolEquipo === 'sub' && !hayCupoDisponibleRemoto(negocio, equiposActuales)) {
        cajaError.innerHTML = `<div class="error">Ya no hay cupo disponible para este local — pide al equipo principal que suelte uno primero.</div>`;
        btn.disabled = false;
        return;
      }
      codigoValidado = { tipo: 'usuario_directo', cliente, negocio, usuario, rolEquipo };
      document.getElementById('infoCliente').textContent =
        `Vas a activar "${cliente.nombre} · ${negocio.nombre}" y entrar directo como ${usuario.nombre}.`;
    }

    document.getElementById('pasoCodigo').style.display = 'none';
    document.getElementById('pasoNombre').style.display = 'flex';
    document.getElementById('btnValidar').style.display = 'none';
    document.getElementById('btnActivarPaso2').style.display = 'block';
    document.getElementById('pasoActualTexto').textContent = 'Paso 2 de 2';
    document.getElementById('tituloActivar').textContent = 'Nombra este equipo';
    document.getElementById('subActivar').textContent = 'Así lo vas a reconocer entre los equipos vinculados.';
    document.getElementById('subActivar').style.color = '';
    document.querySelectorAll('#barraProgreso span')[1].classList.add('activo');
  }

  async function confirmarActivacion() {
    const nombreEquipo = document.getElementById('inputNombreEquipo').value.trim();
    const errorDiv = document.getElementById('cajaError');
    if (!nombreEquipo || !codigoValidado) return;

    const deviceId = getDeviceId();
    const { cliente, negocio } = codigoValidado;
    // "usuario_directo" (código de Manager IH) ya trae decidido si este
    // equipo es el principal o uno adicional (ver validarCodigo) - los
    // otros 2 tipos lo saben por el formato del código nomás.
    const rol = codigoValidado.rolEquipo || (codigoValidado.tipo === 'cliente' ? 'maestro' : 'sub');

    if (rol === 'sub') {
      // Antes este chequeo lo hacia el maestro al escanear la confirmacion
      // de vuelta - ahora que el equipo se confirma solo, el chequeo de
      // cupo se hace aca mismo, contra la lista real en Firestore.
      const equiposActuales = await listarEquiposRemoto(cliente.cliente_id, negocio.negocio_id);
      if (!hayCupoDisponibleRemoto(negocio, equiposActuales)) {
        errorDiv.innerHTML = `<div class="error">Ya no hay cupo disponible para este local — pide al equipo principal que suelte uno primero.</div>`;
        return;
      }
    }

    guardarEstadoEquipo({
      cliente_id: cliente.cliente_id, nombre_cliente: cliente.nombre,
      negocio_id: negocio.negocio_id, nombre_negocio: negocio.nombre, capacidad_equipos: negocio.capacidad_equipos,
      rol, nombre_equipo: nombreEquipo, logo_data: cliente.logo_data || null,
      tipo_licencia: cliente.tipo_licencia, vence: cliente.vence,
    });
    if (rol === 'maestro') {
      await registrarEsteEquipo(cliente.cliente_id, negocio.negocio_id, deviceId, nombreEquipo);
    } else {
      await confirmarEquipoRemoto(cliente.cliente_id, negocio.negocio_id, deviceId, nombreEquipo, codigoValidado.codigoInvitacion);
    }

    if (codigoValidado.tipo === 'usuario_directo') {
      // panel.html lee este parametro UNA vez (lo saca de la URL de
      // inmediato con history.replaceState) para entrar directo como este
      // usuario sin pedir nombre ni clave - ver obtenerUsuarioParaActivarRemoto.
      window.location.href = `panel.html?loginUsuarioId=${encodeURIComponent(codigoValidado.usuario.id)}`;
    } else {
      window.location.href = 'panel.html';
    }
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((e) => console.warn('No se pudo registrar el service worker:', e.message));
    });
  }
</script>
</body>
</html>
