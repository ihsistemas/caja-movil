<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Activar equipo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4374">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
  body { background: #F3F5F7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .tarjeta { background: white; border-radius: 20px; padding: 28px 24px; max-width: 380px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  .icono { width: 56px; height: 56px; border-radius: 16px; background: #E7EBF3; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px auto; }
  h1 { font-size: 19px; text-align: center; color: #1A2530; margin-bottom: 4px; }
  .sub { font-size: 13px; text-align: center; color: #64707C; margin-bottom: 22px; }

  .caja-id { background: #F3F5F7; border: 1.5px dashed #DCE2E7; border-radius: 12px; padding: 14px; margin-bottom: 18px; }
  .caja-id .etiqueta { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: #64707C; margin-bottom: 5px; }
  .caja-id .id-valor { font-family: monospace; font-size: 14px; font-weight: 700; color: #1A2530; word-break: break-all; }

  label { font-size: 12.5px; color: #64707C; font-weight: 600; display: block; margin-bottom: 6px; }
  textarea, input[type=text] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #DCE2E7; font-size: 13px; margin-bottom: 12px; }
  textarea { font-family: monospace; resize: none; height: 70px; }
  .btn-activar { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #2E4374; color: white; font-weight: 700; font-size: 14.5px; }
  .btn-activar:disabled { opacity: .4; }
  .btn-secundario { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #DCE2E7; background: white; color: #1A2530; font-weight: 600; font-size: 13px; margin-bottom: 10px; }
  .error { background: #F7E5E3; color: #C5433A; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; }

  .paso2 { display: none; }

  .modal-full { position: fixed; inset: 0; background: black; z-index: 60; display: none; flex-direction: column; }
  .modal-full.activo { display: flex; }
  .header-escaner { color: white; padding: 16px; display: flex; justify-content: space-between; font-size: 14px; }
  #readerActivacion { flex: 1; }
</style>
</head>
<body>

<div class="tarjeta">
  <div class="icono">🔒</div>
  <h1 id="tituloActivar">Activar este equipo</h1>
  <p class="sub" id="subActivar">Pega el código que te dieron, o escanéalo si viene como QR</p>

  <div class="caja-id">
    <div class="etiqueta">ID de este equipo</div>
    <div class="id-valor" id="deviceIdMostrado">generando...</div>
    <div style="font-size:10.5px; color:#96A2AC; margin-top:6px;">No hace falta que hagas nada con esto — solo lo vamos a pedir si necesitás ayuda técnica.</div>
  </div>

  <div id="cajaError"></div>

  <div id="pasoCodigo">
    <label>Código</label>
    <textarea id="inputCodigo" placeholder="CLI-...#N1 o IHINV-..."></textarea>
    <button class="btn-secundario" onclick="abrirEscanerActivacion()">📷 Escanear código QR</button>
    <button class="btn-activar" id="btnValidar" onclick="validarCodigo()">Continuar</button>
  </div>

  <div id="pasoNombre" class="paso2">
    <p class="sub" id="infoCliente" style="margin-bottom:14px;"></p>
    <label>¿Cómo le quieres llamar a este equipo?</label>
    <input type="text" id="inputNombreEquipo" placeholder="Ej: Caja 2, Celular de Juan...">
    <button class="btn-activar" onclick="confirmarActivacion()">Activar</button>
  </div>
</div>

<!-- ===== ESCANER DE CAMARA (activacion) ===== -->
<div class="modal-full" id="modalEscanerActivacion">
  <div class="header-escaner">
    <span onclick="cerrarEscanerActivacion()">✕</span>
    <span>Escanea el código</span>
  </div>
  <div id="readerActivacion"></div>
</div>

<script src="firebase-sync.bundle.js"></script>
<script src="carrito_compartido.js"></script>
<script src="motor.js"></script>
<script src="html5-qrcode.min.js"></script>
<script>
  inicializarFirebase();

  window.addEventListener('DOMContentLoaded', () => {
    // Si este equipo ya esta activado y la licencia sigue vigente, no tiene
    // sentido mostrar el formulario de activacion de nuevo - eso confundia
    // (por ejemplo, al tocar "atras" en el navegador). Se manda derecho al
    // panel, que ahi sí pide iniciar sesion con el usuario de cada persona.
    const { vigente } = estadoEquipoVigente();
    if (vigente && new URLSearchParams(location.search).get('vencida') !== '1') {
      window.location.href = 'panel.html';
      return;
    }

    document.getElementById('deviceIdMostrado').textContent = getDeviceId();
    if (new URLSearchParams(location.search).get('vencida') === '1') {
      document.getElementById('subActivar').textContent = 'Tu período de prueba venció — pide una clave nueva para seguir usando el programa.';
      document.getElementById('subActivar').style.color = '#C5433A';
    }
  });

  let codigoValidado = null;

  let _html5QrCodeActivacion = null;
  function abrirEscanerActivacion() {
    document.getElementById('modalEscanerActivacion').classList.add('activo');
    _html5QrCodeActivacion = new Html5Qrcode('readerActivacion', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] });
    _html5QrCodeActivacion.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (codigoLeido) => {
        cerrarEscanerActivacion();
        document.getElementById('inputCodigo').value = codigoLeido;
        validarCodigo();
      }
    ).catch(() => {
      document.getElementById('readerActivacion').innerHTML = '<p style="color:white; text-align:center; padding:30px;">No se pudo abrir la cámara — revisa que le hayas dado permiso al navegador.</p>';
    });
  }
  function cerrarEscanerActivacion() {
    // stop() puede tirar error de una (no solo rechazar la promesa) si la
    // camara nunca llego a arrancar - el try/catch evita que eso deje la
    // pantalla negra trabada sin poder volver atras.
    if (_html5QrCodeActivacion) {
      try { _html5QrCodeActivacion.stop().catch(() => {}); } catch (e) {}
      _html5QrCodeActivacion = null;
    }
    document.getElementById('modalEscanerActivacion').classList.remove('activo');
  }

  async function validarCodigo() {
    const texto = document.getElementById('inputCodigo').value.trim();
    const cajaError = document.getElementById('cajaError');
    cajaError.innerHTML = '';
    if (!texto) return;

    const btn = document.getElementById('btnValidar');
    btn.disabled = true;

    const limpio = texto.toUpperCase();
    if (limpio.startsWith('CLI-')) {
      // Codigo de cliente+local ("CLI-XXXXXXXXXX#N1") - se consulta al
      // servidor de verdad, no se calcula nada localmente (asi no se puede
      // falsificar). Mismo esquema que Parking (cliente+sede).
      const partes = parsearCodigoNegocio(texto);
      if (!partes) {
        cajaError.innerHTML = `<div class="error">Este código de cliente está incompleto — le falta la parte del local (después del #). Pídele el código completo a Nacho o a tu jefe.</div>`;
        btn.disabled = false;
        return;
      }
      const [cliente, msg] = await obtenerClienteRemoto(partes.clienteId);
      if (!cliente) {
        cajaError.innerHTML = `<div class="error">${msg}</div>`;
        btn.disabled = false;
        return;
      }
      const [negocio, msgNegocio] = await obtenerNegocioParaActivarRemoto(partes.clienteId, partes.negocioId);
      if (!negocio) {
        cajaError.innerHTML = `<div class="error">${msgNegocio}</div>`;
        btn.disabled = false;
        return;
      }
      codigoValidado = { tipo: 'cliente', cliente, negocio };
      document.getElementById('infoCliente').textContent =
        `Vas a activar "${cliente.nombre} · ${negocio.nombre}" — serás el equipo PRINCIPAL (maestro) de este local.`;
    } else if (limpio.startsWith('IHINV-')) {
      const [inv, msg] = await validarInvitacionRemota(texto);
      if (!inv) {
        cajaError.innerHTML = `<div class="error">${msg}</div>`;
        btn.disabled = false;
        return;
      }
      // La invitacion solo dice A QUE cliente/local unirse - los datos
      // reales (capacidad, vencimiento) se consultan frescos al servidor aca.
      const [cliente, msgCliente] = await obtenerClienteRemoto(inv.cliente_id);
      if (!cliente) {
        cajaError.innerHTML = `<div class="error">${msgCliente}</div>`;
        btn.disabled = false;
        return;
      }
      const [negocio, msgNegocio] = await obtenerNegocioParaActivarRemoto(inv.cliente_id, inv.negocio_id);
      if (!negocio) {
        cajaError.innerHTML = `<div class="error">${msgNegocio}</div>`;
        btn.disabled = false;
        return;
      }
      codigoValidado = { tipo: 'invitacion', cliente, negocio, codigoInvitacion: inv.codigo_invitacion };
      document.getElementById('infoCliente').textContent =
        `Te vas a sumar a "${cliente.nombre} · ${negocio.nombre}" como equipo adicional.`;
    } else {
      cajaError.innerHTML = `<div class="error">No reconozco este código — revisa que esté completo y sin espacios de más.</div>`;
      btn.disabled = false;
      return;
    }

    document.getElementById('pasoCodigo').style.display = 'none';
    document.getElementById('pasoNombre').style.display = 'block';
  }

  async function confirmarActivacion() {
    const nombreEquipo = document.getElementById('inputNombreEquipo').value.trim();
    const errorDiv = document.getElementById('cajaError');
    if (!nombreEquipo || !codigoValidado) return;

    const deviceId = getDeviceId();
    const { cliente, negocio } = codigoValidado;
    const rol = codigoValidado.tipo === 'cliente' ? 'maestro' : 'sub';

    if (rol === 'sub') {
      // Antes este chequeo lo hacia el maestro al escanear la confirmacion
      // de vuelta - ahora que el equipo se confirma solo, el chequeo de
      // cupo se hace aca mismo, contra la lista real en Firestore.
      const equiposActuales = await listarEquiposRemoto(cliente.cliente_id, negocio.negocio_id);
      if (!hayCupoDisponibleRemoto(negocio, equiposActuales)) {
        errorDiv.innerHTML = `<div class="error">Ya no hay cupo disponible para este local — pide al equipo principal que suelte uno primero.</div>`;
        return;
      }
    }

    guardarEstadoEquipo({
      cliente_id: cliente.cliente_id, nombre_cliente: cliente.nombre,
      negocio_id: negocio.negocio_id, nombre_negocio: negocio.nombre, capacidad_equipos: negocio.capacidad_equipos,
      rol, nombre_equipo: nombreEquipo, logo_data: cliente.logo_data || null,
      tipo_licencia: cliente.tipo_licencia, vence: cliente.vence,
    });
    if (rol === 'maestro') {
      await registrarEsteEquipo(cliente.cliente_id, negocio.negocio_id, deviceId, nombreEquipo);
    } else {
      await confirmarEquipoRemoto(cliente.cliente_id, negocio.negocio_id, deviceId, nombreEquipo, codigoValidado.codigoInvitacion);
    }

    window.location.href = 'panel.html';
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((e) => console.warn('No se pudo registrar el service worker:', e.message));
    });
  }
</script>
</body>
</html>
